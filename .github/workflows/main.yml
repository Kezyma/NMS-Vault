# What a push to main does: check it, then publish the site.
#
# One workflow with the check as a job, rather than a separate workflow triggering on the same
# push, so the build and the tests run once per push instead of once for the check and again for
# the deployment. ci.yml still runs on its own for a pull request, which is the case with no
# deployment behind it.

name: Main

on:
  push:
    branches: [main]

  # Republishes without a commit - after changing a Pages setting, say.
  workflow_dispatch:

jobs:
  # Nothing is deployed from a commit whose tests did not pass, and "it compiled" is not that
  # check: the publish below would build happily over a failing test.
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check

    permissions:
      contents: read
      pages: write
      id-token: write

    # Never two at once, and a newer publish wins rather than queueing behind an older one.
    concurrency:
      group: pages
      cancel-in-progress: true

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The gallery is built from data/ as part of this, by the web project itself, and the base
      # href is rewritten from "/" to the repository path by its PrepareForPages target. Both are
      # in the project rather than here, so that building the site locally produces the same site.
      - name: Publish
        run: dotnet publish src/NmsVault.Web --configuration Release --output artifacts/pages

      # _framework is the application: the runtime, the assemblies and the boot manifest. The
      # page loads without it and sits on "Loading the vault..." forever, because the script
      # that would replace it 404s. Everything else can be present and correct and the site
      # still be nothing but its loading screen, which is how this got deployed once already.
      # The script index.html asks for has to be the script that was published. Publish renames
      # it to carry a content hash, and the page names it through a placeholder the SDK fills
      # in - so the two can disagree, and when they do every page loads its shell, sits on
      # "Loading the vault..." and never starts. Checked by following what the page actually
      # asks for rather than by looking for a fixed name, because the name is not fixed.
      - name: Check the page asks for a script that exists
        run: |
          root=artifacts/pages/wwwroot
          asked=$(grep -o '_framework/blazor\.webassembly[^"]*\.js' "$root/index.html" | head -1)

          if [ -z "$asked" ]; then
            echo "::error::index.html names no Blazor script at all."
            exit 1
          fi

          if [ ! -f "$root/$asked" ]; then
            echo "::error::index.html asks for '$asked', which was not published. The page would never start."
            echo "What _framework actually holds:"
            ls "$root/_framework" | grep -E '^blazor\.webassembly' || echo "  no blazor.webassembly script at all"
            exit 1
          fi

          echo "index.html asks for $asked, which is there."

          # The loader then asks for this one by name, flatly - there is no boot manifest and no
          # import map, so nothing can redirect it to a hashed file the way the dev server does.
          # Fingerprinting it produced a site that loaded its shell and never started.
          if [ ! -f "$root/_framework/dotnet.js" ]; then
            echo "::error::_framework/dotnet.js was not published under that name, so the platform would never start."
            ls "$root/_framework" | grep -E '^dotnet' || echo "  no dotnet script at all"
            exit 1
          fi

          echo "Publishing $(find "$root" -type f | wc -l) file(s), $(du -sh "$root" | cut -f1)."

      # Without this, Pages runs the output through Jekyll, which drops every folder whose name
      # begins with an underscore - _framework among them, which is the whole application. The
      # symptom is a blank page with nothing in the console to explain it.
      - name: Check the site will not be run through Jekyll
        run: test -f artifacts/pages/wwwroot/.nojekyll || { echo "::error::No .nojekyll in the published site; Pages would drop _framework."; exit 1; }

      # A site published with base href="/" resolves every asset against the domain root and comes
      # up blank. PrepareForPages rewrites it, and a rewrite that silently matched nothing would
      # otherwise only be discovered by opening the deployed page.
      - name: Check the base href was rewritten
        run: grep -q '<base href="/NMS-Vault/" />' artifacts/pages/wwwroot/index.html || { echo "::error::index.html still has base href=\"/\"; every asset would resolve against the domain root."; exit 1; }

      # The gallery is generated, so an empty one is a build that quietly did nothing rather than
      # a site worth publishing.
      - name: Check the gallery is not empty
        run: test -s artifacts/pages/wwwroot/gallery/index.json || { echo "::error::No gallery index in the published site."; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/pages/wwwroot

      - id: deployment
        uses: actions/deploy-pages@v4
