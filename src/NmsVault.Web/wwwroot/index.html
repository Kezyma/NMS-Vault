<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NMS-Vault</title>
    <base href="/" />
    <!-- The game's own S-class badge, which is the mark the gallery is about. -->
    <link rel="icon" type="image/webp" href="gallery/img/class/s.webp" />
    <!--
        The nearest open-licensed match for the game's own UI face: a humanist sans with
        squared terminals that holds up in tracked uppercase, which this interface leans on.
        Preconnected because it is a render-blocking stylesheet on a static host.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600&display=swap" />

    <link rel="stylesheet" href="css/vault.css" />
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">
        <div class="boot">Loading the vault&hellip;</div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong. Reloading the page may fix it.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">&times;</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
