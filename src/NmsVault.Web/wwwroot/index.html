<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NMS-Vault</title>
    <base href="/" />
    <!-- The game's own S-class badge, which is the mark the gallery is about. -->
    <link rel="icon" type="image/webp" href="gallery/img/class/s.webp" />
    <!--
        The nearest open-licensed match for the game's own UI face, served from here rather
        than from a third party. The two weights the page opens with are preloaded, because a
        font discovered inside a stylesheet is two round trips late.
    -->
    <link rel="preload" href="fonts/titillium-web-300-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/titillium-web-400-latin.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/vault.css" />
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">
        <div class="boot">Loading the vault&hellip;</div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong. Reloading the page may fix it.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">&times;</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
